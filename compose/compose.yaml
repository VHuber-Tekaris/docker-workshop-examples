# An explicit project name. Without it Compose derives the name from the
# folder, and everything that depends on container names breaks on a rename.
name: quote-demo

services:
  web:
    restart: on-failure
    build: ./quote-app
    # A port *range*: each of the 3 replicas gets its own host port,
    # so you can also reach a single container directly (81, 82, 83).
    ports:
      - "81-83:5000"
    scale: 3

  nginx:
    restart: on-failure
    build: ./loadbalancer
    ports:
      - "8081:80"
    depends_on:
      - web
